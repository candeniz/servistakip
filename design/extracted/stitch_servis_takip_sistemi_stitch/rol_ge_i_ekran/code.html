<style>
        @keyframes pulse-ring {
            0% { transform: scale(.33); }
            80%, 100% { opacity: 0; }
        }
        @keyframes pulse-dot {
            0% { transform: scale(.8); }
            50% { transform: scale(1); }
            100% { transform: scale(.8); }
        }
        .pulse-ring {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 120px;
            height: 120px;
            background-color: #316bf3;
            border-radius: 50%;
            opacity: 0.4;
            animation: pulse-ring 2.5s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
        .pulse-dot {
            animation: pulse-dot 1.5s cubic-bezier(0.455, 0.03, 0.515, 0.955) -0.4s infinite;
        }
        .loading-bar-container {
            width: 200px;
            height: 4px;
            background-color: #e5eeff;
            border-radius: 2px;
            overflow: hidden;
            position: relative;
        }
        .loading-bar-progress {
            position: absolute;
            height: 100%;
            background-color: #0051d5;
            width: 30%;
            border-radius: 2px;
            animation: slide 1.5s infinite ease-in-out;
        }
        @keyframes slide {
            0% { left: -30%; }
            100% { left: 100%; }
        }
        body {
            background-color: #f8f9ff;
            overflow: hidden;
        }
    </style>

<body class="flex items-center justify-center min-h-screen font-body-md text-on-surface">

<div class="border-l border-outline-variant h-full"></div>
<div class="border-l border-outline-variant h-full"></div>
<div class="border-l border-outline-variant h-full"></div>

<!-- Animation Context Center -->

<div class="relative z-20 w-24 h-24 bg-white shadow-lg rounded-full flex items-center justify-center border border-outline-variant pulse-dot">

<!-- Micro-interaction Script for Role Simulation -->
<script>
        const roles = [
            {
                message: "Sürücü Paneline Yönlendiriliyorsunuz...",
                sub: "Sistem verileri ve güzergah bilgileriniz hazırlanıyor. Lütfen bekleyiniz.",
                icon: "local_shipping",
                color: "#0051d5"
            },
            {
                message: "Yolcu Ekranı Hazırlanıyor...",
                sub: "Servis konumu ve tahmini varış süresi hesaplanıyor.",
                icon: "person_pin_circle",
                color: "#316bf3"
            },
            {
                message: "Yönetici Konsolu Açılıyor...",
                sub: "Operasyonel veriler ve filo durumu yükleniyor.",
                icon: "dashboard",
                color: "#04162f"
            }
        ];

        let currentRole = 0;
        const msgEl = document.getElementById('role-message');
        const subEl = document.getElementById('sub-message');
        const iconEl = document.getElementById('role-icon');

        // Simple loop to show transition capability for the splash screen demo
        setInterval(() => {
            currentRole = (currentRole + 1) % roles.length;
            
            // Fade out
            document.querySelector('main').style.opacity = '0.5';
            document.querySelector('main').style.transition = 'opacity 0.3s ease';

            setTimeout(() => {
                const role = roles[currentRole];
                msgEl.innerText = role.message;
                subEl.innerText = role.sub;
                iconEl.innerText = role.icon;
                iconEl.style.color = role.color;
                
                // Fade in
                document.querySelector('main').style.opacity = '1';
            }, 300);
        }, 4000);

        // Real-time Pulse Animation (Micro-interaction)
        document.addEventListener('mousemove', (e) => {
            const dot = document.querySelector('.pulse-dot');
            const rect = dot.getBoundingClientRect();
            const x = e.clientX - rect.left - rect.width / 2;
            const y = e.clientY - rect.top - rect.height / 2;
            
            dot.style.transform = `translate(${x * 0.05}px, ${y * 0.05}px)`;
        });
    </script>
