<style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #04162f; /* Using primary color directly for the splash base */
        }

        .animate-fade-in {
            animation: fadeIn 1s ease-out forwards;
        }

        .animate-slide-up {
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .animate-pulse-slow {
            animation: pulseSlow 3s ease-in-out infinite;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @keyframes pulseSlow {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.05); }
        }

        /* Scanline effect for operational feel */
        .scanline {
            width: 100%;
            height: 2px;
            background: linear-gradient(to right, transparent, #316bf3, transparent);
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0.2;
            animation: scan 4s linear infinite;
        }

        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }
    </style>
</head>
<body class="bg-primary flex items-center justify-center min-h-screen">
<!-- Atmospheric WebGL-style Shader Background -->
<div class="absolute inset-0 z-0 overflow-hidden opacity-40">
<!-- Circular gradients to create depth without assets -->
<div class="absolute top-[-20%] left-[-10%] w-[60%] h-[60%] rounded-full bg-secondary blur-[120px] animate-pulse-slow"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] rounded-full bg-primary-container blur-[100px] animate-pulse-slow" style="animation-delay: 1.5s;"></div>
<div class="scanline"></div>
</div>
<!-- Main Splash Content -->
<main class="relative z-10 flex flex-col items-center">
<!-- Logo Container -->
<div class="mb-lg flex items-center justify-center animate-fade-in">
<div class="w-20 h-20 bg-secondary-container rounded-xl flex items-center justify-center shadow-lg transform transition-transform hover:scale-105">
<span class="material-symbols-outlined text-[48px] text-on-secondary-container" data-icon="local_shipping" style="font-variation-settings: 'FILL' 1;">
                    local_shipping
                </span>
</div>
</div>
<!-- Headline -->
<div class="text-center animate-slide-up" style="animation-delay: 0.2s;">
<h1 class="font-headline-lg text-headline-lg text-primary-fixed tracking-tight mb-base">
                Servis Takip
            </h1>
<p class="font-label-md text-label-md text-on-primary-container uppercase tracking-[0.2em]">
                Operasyonel Mükemmellik
            </p>
</div>
<!-- Status Indicator / Loading -->
<div class="mt-xl flex flex-col items-center animate-fade-in" style="animation-delay: 0.6s;">
<div class="flex gap-xs mb-md">
<div class="w-2 h-2 rounded-full bg-secondary-fixed-dim animate-bounce" style="animation-delay: 0s;"></div>
<div class="w-2 h-2 rounded-full bg-secondary-fixed-dim animate-bounce" style="animation-delay: 0.1s;"></div>
<div class="w-2 h-2 rounded-full bg-secondary-fixed-dim animate-bounce" style="animation-delay: 0.2s;"></div>
</div>
<!-- Mono Badge for versioning/system info -->
<div class="px-md py-xs bg-primary-container border border-outline-variant rounded-lg">
<span class="font-label-md text-label-md text-secondary-fixed-dim">
                    SİSTEM KONTROLÜ: AKTİF
                </span>
</div>
</div>
</main>
<!-- Bottom Attribution -->
<footer class="fixed bottom-xl w-full text-center z-10 animate-fade-in" style="animation-delay: 1s;">
<p class="font-body-md text-body-md text-on-primary-container opacity-60">
            Lojistik ve Filo Yönetim Çözümleri
        </p>
</footer>
<!-- Decorative Border Elements -->
<div class="fixed top-0 left-0 w-32 h-32 border-t-2 border-l-2 border-secondary/20 m-md"></div>
<div class="fixed bottom-0 right-0 w-32 h-32 border-b-2 border-r-2 border-secondary/20 m-md"></div>
<script>
        // Micro-interaction: Mouse tracking glow
        document.addEventListener('mousemove', (e) => {
            const glow = document.createElement('div');
            glow.className = 'fixed pointer-events-none w-64 h-64 bg-secondary/5 rounded-full blur-[80px] z-0';
            glow.style.left = (e.clientX - 128) + 'px';
            glow.style.top = (e.clientY - 128) + 'px';
            
            // Limit performance impact
            const existingGlows = document.querySelectorAll('.pointer-events-none.bg-secondary\\/5');
            if (existingGlows.length > 0) {
                existingGlows.forEach(g => g.remove());
            }
            
            document.body.appendChild(glow);
        });

        // Simulate a redirect after loading
        /*
        setTimeout(() => {
            window.location.href = '/dashboard';
        }, 3500);
        */
    </script>
