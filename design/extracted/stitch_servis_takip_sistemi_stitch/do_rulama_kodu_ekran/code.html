<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col">
<!-- TopAppBar - Suppressed Shell logic implies minimal or hidden nav for transactional screens,

<button class="w-10 h-10 flex items-center justify-center text-primary active:scale-95 transition-transform">

</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary">Servis Takibi</h1>
<button class="w-10 h-10 flex items-center justify-center text-primary active:scale-95 transition-transform">
<span class="material-symbols-outlined" data-icon="help_outline">help_outline</span>
</button>
</header>
<main class="flex-grow flex items-center justify-center px-margin-mobile pt-14">
<div class="max-w-md w-full bg-surface-container-lowest border border-outline-variant rounded-xl p-lg shadow-md">

<div class="inline-flex items-center justify-center w-16 h-16 bg-surface-container-highest rounded-full mb-md">

<p class="font-body-md text-on-surface-variant">

<!-- OTP Input Section -->
<form class="space-y-lg" id="otp-form">
<div class="flex justify-between gap-xs sm:gap-sm mb-lg" id="otp-inputs">
<input class="otp-input w-full aspect-square text-center font-display-lg text-secondary bg-surface-container-low border border-outline-variant rounded-lg focus:border-secondary transition-all" inputmode="numeric" maxlength="1" pattern="[0-9]*" required="" type="text"/>
<input class="otp-input w-full aspect-square text-center font-display-lg text-secondary bg-surface-container-low border border-outline-variant rounded-lg focus:border-secondary transition-all" inputmode="numeric" maxlength="1" pattern="[0-9]*" required="" type="text"/>
<input class="otp-input w-full aspect-square text-center font-display-lg text-secondary bg-surface-container-low border border-outline-variant rounded-lg focus:border-secondary transition-all" inputmode="numeric" maxlength="1" pattern="[0-9]*" required="" type="text"/>
<input class="otp-input w-full aspect-square text-center font-display-lg text-secondary bg-surface-container-low border border-outline-variant rounded-lg focus:border-secondary transition-all" inputmode="numeric" maxlength="1" pattern="[0-9]*" required="" type="text"/>
<input class="otp-input w-full aspect-square text-center font-display-lg text-secondary bg-surface-container-low border border-outline-variant rounded-lg focus:border-secondary transition-all" inputmode="numeric" maxlength="1" pattern="[0-9]*" required="" type="text"/>
<input class="otp-input w-full aspect-square text-center font-display-lg text-secondary bg-surface-container-low border border-outline-variant rounded-lg focus:border-secondary transition-all" inputmode="numeric" maxlength="1" pattern="[0-9]*" required="" type="text"/>
</div>

                    Doğrula
                </button>
</form>

<div class="flex flex-col items-center gap-xs">

                        Kodu almadınız mı? 
                        <span class="font-label-md text-secondary" id="timer">01:59</span>
</p>
<button class="text-secondary opacity-50 cursor-not-allowed font-bold hover:underline transition-all" disabled="" id="resend-btn">
                        Kodu Tekrar Gönder
                    </button>
</div>
<div class="pt-lg border-t border-outline-variant">

<!-- Background Decoration -->
<div class="fixed inset-0 -z-10 pointer-events-none opacity-40">
<div class="absolute top-1/4 -right-20 w-80 h-80 bg-surface-container-highest rounded-full blur-[100px]"></div>
<div class="absolute bottom-1/4 -left-20 w-80 h-80 bg-secondary-fixed-dim rounded-full blur-[100px]"></div>
</div>
<script>
        // OTP Input Logic
        const inputs = document.querySelectorAll('#otp-inputs input');
        
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length > 1) {
                    e.target.value = e.target.value.slice(0, 1);
                }
                if (e.target.value && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    inputs[index - 1].focus();
                }
            });
        });

        // Timer Logic
        let timeLeft = 119;
        const timerDisplay = document.getElementById('timer');
        const resendBtn = document.getElementById('resend-btn');

        const countdown = setInterval(() => {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            
            timerDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            
            if (timeLeft <= 0) {
                clearInterval(countdown);
                timerDisplay.textContent = "Süre doldu";
                resendBtn.disabled = false;
                resendBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
            timeLeft--;
        }, 1000);

        // Form Submit
        document.getElementById('otp-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const otp = Array.from(inputs).map(i => i.value).join('');
            if (otp.length === 6) {
                alert(`Doğrulama başarılı: ${otp}`);
            }
        });
    </script>
